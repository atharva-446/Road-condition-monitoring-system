name: road_condition_monitor
description: "Road Condition, Suspension, and Fleet Telemetry Monitor"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  firebase_database: ^12.4.4
  google_maps_flutter: ^2.18.0
  google_fonts: ^6.2.1
  intl: ^0.20.3

  model_viewer_plus: ^1.7.0

  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.4
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Synced 3D asset names
  assets:
    - assets/models/mini-truck.glb
    - assets/models/leaf_spring.glb